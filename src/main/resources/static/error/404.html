<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>404 — Página não encontrada | Garage Gran Turismo</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			background: #111214;
			color: #f5f5f5;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: radial-gradient(ellipse at 50% 100%, #632126 0, #111214 58%);
		}
		main { width: min(100%, 560px); text-align: center; padding: 32px 16px; }
		.brand {
			color: #ff5962;
			font-size: .75rem;
			font-weight: 800;
			letter-spacing: .2em;
			text-transform: uppercase;
		}
		h1 {
			margin: 18px 0 0;
			font-size: clamp(7rem, 27vw, 12rem);
			font-weight: 900;
			letter-spacing: -.09em;
			line-height: .9;
		}
		h1 span { color: #ed3e48; }
		h2 { margin: 28px 0 10px; font-size: clamp(1.35rem, 5vw, 1.8rem); }
		p { margin: 0 auto; max-width: 420px; color: #b7b7bd; line-height: 1.7; }
		a {
			display: inline-block;
			margin-top: 28px;
			padding: 13px 22px;
			border-radius: 5px;
			background: #ed3e48;
			color: #fff;
			font-weight: 700;
			text-decoration: none;
		}
		a:hover { background: #d72d37; }
		a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
	</style>
</head>
<body>
	<main>
		<div class="brand">Garage Gran Turismo</div>
		<h1>4<span>0</span>4</h1>
		<h2>Página não encontrada</h2>
		<p>Este endereço não está na pista. Confira o link ou volte para a página inicial.</p>
		<a href="/">Voltar ao início</a>
	</main>
</body>
</html>
